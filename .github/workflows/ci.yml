name: ci

on:
    pull_request:
        branches:
            - main

jobs:
    tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: setup go
              uses: actions/setup-go@v4
              with:
                  go-version: 1.26.0

            - name: run tests
              run: go test -v ./...

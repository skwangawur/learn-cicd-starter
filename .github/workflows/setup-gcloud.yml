name: setup gcloud

on:
    push:
        branches:
            - main 

jobs:
    SetupCloud:
        runs-on: ubuntu-latest
        steps:

            - id: 'auth'
              uses: 'google-github-actions/auth@v3'
              with:
                 credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

            - name: 'Set up Cloud SDK'
              uses: 'google-github-actions/setup-gcloud@v2'

            - name: 'Use gcloud CLI'
              run: gcloud info
            
    
    BuildDockerImage:
        runs-on: ubuntu-latest
        needs: SetupCloud
        steps:
            - name: 'build docker image'
              run: gcloud builds submit --tag us-central1-docker.pkg.dev/bootdev-cicd-507910/notely-ar-repo/notely:latest .